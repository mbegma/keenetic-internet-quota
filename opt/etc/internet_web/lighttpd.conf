server.document-root = "/opt/share/www"

server.bind = "192.168.1.1"
server.port = 8080

server.modules = (
    "mod_cgi",
    "mod_alias", 
    "mod_redirect"
)

index-file.names = (
    "index.html"
)

alias.url = (
    "/quota" => "/opt/share/internet_web"
)

url.redirect = (
    "^/quota$" => "/quota/"
)

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8", 
    ".svg"  => "image/svg+xml", 
    ".png"  => "image/png", 
    ".ico"  => "image/x-icon", 
    ".woff2"=> "font/woff2"
)

$HTTP["url"] =~ "^/quota/cgi-bin/" {
    cgi.assign = (
        ".sh" => "/opt/bin/sh"
    )
}

server.errorlog = "/opt/etc/internet_web/lighttpd.error.log"

server.pid-file = "/opt/etc/internet_web/lighttpd.pid"

