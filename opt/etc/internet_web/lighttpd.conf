server.document-root = "/opt/share/internet_web"

server.bind = "192.168.1.1"
server.port = 8080

server.modules = (
    "mod_cgi"
)

index-file.names = (
    "index.html"
)

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript"
)

cgi.assign = (
    ".sh" => "/opt/bin/sh"
)

server.errorlog = "/opt/etc/internet_web/lighttpd.error.log"

server.pid-file = "/opt/etc/internet_web/lighttpd.pid"

