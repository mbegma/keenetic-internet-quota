# Internet Web Interface configuration

# Web server
WEB_PORT=8080
WEB_BIND="192.168.1.1"

# Project directories
WEB_CONFIG_DIR="/opt/etc/internet_web"
WEB_DOC_ROOT="/opt/share/www"
WEB_CGI_DIR="$WEB_DOC_ROOT/cgi-bin"

# Internet quota project
QUOTA_CONFIG="/opt/etc/internet_quota/internet_quota.conf"
QUOTA_STATE="/opt/etc/internet_quota/internet_quota.state"